services:
  glm-free-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: hellogml:local
    container_name: glm-free-api
    restart: always
    ports:
      - "38412:38412"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:38412/ping').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
